<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#E1BA51" />
      <stop offset="50%" stop-color="#C59A3F" />
      <stop offset="75%" stop-color="#A57922" />
      <stop offset="100%" stop-color="#7A5300" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#C89D42" />
      <stop offset="30%" stop-color="#FFF5C2" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#FFF5C2" />
      <stop offset="100%" stop-color="#C89D42" />
    </linearGradient>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#3D2900" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- 1. DUM HANDI POT & STEAM (Top) -->
    <!-- Rising Steam Curves -->
    <path d="M 250 115 C 235 95 265 75 250 55 C 238 39 220 45 238 25 C 248 15 258 5 250 -5" 
          fill="none" stroke="url(#goldShine)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 235 75 C 225 85 245 95 230 105" 
          fill="none" stroke="url(#goldShine)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 265 75 C 275 85 255 95 270 105" 
          fill="none" stroke="url(#goldShine)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Pot Mouth / Flared Rim -->
    <ellipse cx="250" cy="120" rx="42" ry="9" fill="none" stroke="url(#goldShine)" stroke-width="6"/>
    <path d="M 210 120 C 210 133 222 142 250 142 C 278 142 290 133 290 120" fill="none" stroke="url(#goldShine)" stroke-width="4.5"/>

    <!-- Pot Neck & Belly -->
    <path d="M 215 125 C 222 140 215 152 192 172 C 166 195 168 228 192 255 C 218 282 282 282 308 255 C 332 228 334 195 308 172 C 285 152 278 140 285 125" 
          fill="none" stroke="url(#goldShine)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pot Base -->
    <path d="M 222 268 L 278 268" fill="none" stroke="url(#goldShine)" stroke-width="6" stroke-linecap="round"/>

    <!-- Decorative Handi Belts / Rings & Dots -->
    <path d="M 186 192 C 212 203 288 203 314 192" fill="none" stroke="url(#goldShine)" stroke-width="4"/>
    <path d="M 180 208 C 212 219 288 219 320 208" fill="none" stroke="url(#goldShine)" stroke-width="4"/>
    <path d="M 178 226 C 212 237 288 237 322 226" fill="none" stroke="url(#goldShine)" stroke-width="4"/>

    <!-- Dots in middle belt -->
    <circle cx="210" cy="205" r="3.5" fill="url(#goldShine)"/>
    <circle cx="230" cy="207" r="3.5" fill="url(#goldShine)"/>
    <circle cx="250" cy="208" r="3.5" fill="url(#goldShine)"/>
    <circle cx="270" cy="207" r="3.5" fill="url(#goldShine)"/>
    <circle cx="290" cy="205" r="3.5" fill="url(#goldShine)"/>


    <!-- 2. "VEDIQ" BRAND NAME (Middle) -->
    <text x="250" y="350" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', 'Georgia', serif" 
          font-size="96" 
          font-weight="900" 
          letter-spacing="16" 
          text-anchor="middle" 
          fill="url(#goldHighlight)">VEDIQ</text>


    <!-- 3. "— BIRYANI —" (Below VEDIQ) -->
    <!-- Left Divider Line -->
    <line x1="20" y1="398" x2="150" y2="398" stroke="url(#goldHighlight)" stroke-width="4" stroke-linecap="round"/>
    <!-- BIRYANI Text -->
    <text x="250" y="408" 
          font-family="'Montserrat', 'Cinzel', 'Trajan Pro', sans-serif" 
          font-size="30" 
          font-weight="800" 
          letter-spacing="18" 
          text-anchor="middle" 
          fill="url(#goldHighlight)">BIRYANI</text>
    <!-- Right Divider Line -->
    <line x1="350" y1="398" x2="480" y2="398" stroke="url(#goldHighlight)" stroke-width="4" stroke-linecap="round"/>


    <!-- 4. "The Heritage of Aromas" (Tagline) -->
    <text x="250" y="458" 
          font-family="'Playfair Display', 'Baskerville', 'Georgia', 'Times New Roman', serif" 
          font-size="28" 
          font-style="italic" 
          font-weight="600" 
          letter-spacing="1.5" 
          text-anchor="middle" 
          fill="url(#goldShine)">The Heritage of Aromas</text>


    <!-- 5. DECORATIVE LEAFY LAUREL BRANCHES & DOT (Bottom) -->
    <!-- Center Dot -->
    <circle cx="250" cy="502" r="5" fill="url(#goldHighlight)"/>

    <!-- Left Branch -->
    <path d="M 240 502 C 195 498 150 475 130 460" fill="none" stroke="url(#goldHighlight)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Left Leaves -->
    <path d="M 222 500 C 212 488 197 486 200 498 C 207 503 217 503 222 500 Z" fill="url(#goldHighlight)"/>
    <path d="M 195 490 C 180 476 165 476 171 488 C 179 494 190 493 195 490 Z" fill="url(#goldHighlight)"/>
    <path d="M 168 476 C 153 460 138 463 146 474 C 154 480 163 478 168 476 Z" fill="url(#goldHighlight)"/>
    <path d="M 227 502 C 217 514 202 516 207 506 Z" fill="url(#goldHighlight)"/>
    <path d="M 197 494 C 185 508 170 508 177 497 Z" fill="url(#goldHighlight)"/>

    <!-- Right Branch -->
    <path d="M 260 502 C 305 498 350 475 370 460" fill="none" stroke="url(#goldHighlight)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Right Leaves -->
    <path d="M 278 500 C 288 488 303 486 300 498 C 293 503 283 503 278 500 Z" fill="url(#goldHighlight)"/>
    <path d="M 305 490 C 320 476 335 476 329 488 C 321 494 310 493 305 490 Z" fill="url(#goldHighlight)"/>
    <path d="M 332 476 C 347 460 362 463 354 474 C 346 480 337 478 332 476 Z" fill="url(#goldHighlight)"/>
    <path d="M 273 502 C 283 514 298 516 293 506 Z" fill="url(#goldHighlight)"/>
    <path d="M 303 494 C 315 508 330 508 323 497 Z" fill="url(#goldHighlight)"/>
  </g>
</svg>