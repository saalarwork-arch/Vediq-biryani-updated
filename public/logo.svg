<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="50%" stop-color="#C59A3F" />
      <stop offset="100%" stop-color="#8E6A21" />
    </linearGradient>
  </defs>
  
  <!-- Steaming Handi Pot -->
  <g transform="translate(140, 40) scale(1.2)">
    <path d="M50 4C48 10 52 14 50 20C48 24 45 23 48 28" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M44 10C42 14 45 18 43 23" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M56 10C58 14 55 18 57 23" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <ellipse cx="50" cy="32" rx="24" ry="4.5" stroke="url(#goldGrad)" stroke-width="3.5" fill="none" />
    <path d="M30 32C32 40 22 46 22 62C22 78 34 88 50 88C66 88 78 78 78 62C78 46 68 40 70 32" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M38 88H62" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M24 54C32 58 68 58 76 54" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" />
    <path d="M24 64C32 68 68 68 76 64" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" />
    <circle cx="35" cy="59" r="2" fill="url(#goldGrad)" />
    <circle cx="45" cy="60" r="2" fill="url(#goldGrad)" />
    <circle cx="55" cy="60" r="2" fill="url(#goldGrad)" />
    <circle cx="65" cy="59" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Wordmark VEDIQ -->
  <text x="200" y="240" text-anchor="middle" font-family="Cinzel, 'Playfair Display', Georgia, serif" font-size="52" font-weight="800" letter-spacing="8" fill="url(#goldGrad)">VEDIQ</text>
  
  <!-- Sub-wordmark BIRYANI with lines -->
  <line x1="50" y1="285" x2="135" y2="285" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="200" y="292" text-anchor="middle" font-family="Cinzel, 'Playfair Display', Georgia, serif" font-size="24" font-weight="600" letter-spacing="12" fill="url(#goldGrad)">BIRYANI</text>
  <line x1="265" y1="285" x2="350" y2="285" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Tagline -->
  <text x="200" y="340" text-anchor="middle" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="22" font-weight="400" letter-spacing="2" fill="url(#goldGrad)">The Heritage of Aromas</text>
  
  <!-- Symmetrical Branch Flourish -->
  <g transform="translate(130, 360) scale(0.7)">
    <path d="M30 15 C 50 5, 80 10, 100 15" stroke="url(#goldGrad)" stroke-width="2" fill="none" />
    <path d="M100 15 C 120 10, 150 5, 170 15" stroke="url(#goldGrad)" stroke-width="2" fill="none" />
    <circle cx="100" cy="15" r="3" fill="url(#goldGrad)" />
  </g>
</svg>
